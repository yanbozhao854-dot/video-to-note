name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server-container:
    name: Linux server container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux image
        run: docker build --tag video-to-note:test .
      - name: Verify authenticated server startup
        shell: bash
        run: |
          docker run -d --name video-to-note-test -p 127.0.0.1:18000:8000 \
            -e VIDEOTONOTES_ACCESS_TOKEN=test-only-container-token-123456789 \
            -e VIDEOTONOTES_PUBLIC_ORIGIN=http://127.0.0.1:18000 video-to-note:test
          for attempt in {1..60}; do
            if curl -fsS -H 'Authorization: Bearer test-only-container-token-123456789' \
              http://127.0.0.1:18000/api/health > /tmp/health.json; then break; fi
            sleep 2
          done
          python -c "import json; d=json.load(open('/tmp/health.json')); assert d['access_mode']=='server' and d['max_concurrent_tasks']==5"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18000/api/health)" = 401
          curl -fsS http://127.0.0.1:18000/ | grep -q '管理员登录'
      - name: Container diagnostics
        if: failure()
        run: docker logs video-to-note-test
      - name: Cleanup
        if: always()
        run: docker rm -f video-to-note-test || true
  test:
    name: Tests (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  syntax:
    name: Syntax checks (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile Python sources
        run: python -m compileall -q backend launcher.py

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/script.js
          node --check frontend/sync.js
          node --check frontend/theme-bootstrap.js
